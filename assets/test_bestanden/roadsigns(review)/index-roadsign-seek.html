<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>NDW Viewer Dark</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="../data/gemeentes.js"></script>

<style>
html,body{margin:0;height:100%;font-family:Arial}
#map{width:100%;height:100%}

#searchBox{
  position:absolute;
  top:15px;
  left:15px;
  background:#1e1e1e;
  color:white;
  padding:12px;
  border-radius:6px;
  width:280px;
  z-index:10;
  max-height:90vh;
  overflow-y:auto;
}

select,button{width:100%;margin-top:8px;padding:6px}
button{background:#3b82f6;color:white;border:none;cursor:pointer}

.toggle-group {
  margin-top: 12px;
  padding-top: 8px;
  border-top: 1px solid #444;
}

.toggle-group label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 14px;
}

.toggle-group input {
  width: auto;
  margin: 0;
  cursor: pointer;
}

.status-text {
  margin-left: auto;
  font-size: 11px;
  color: #ff6b6b;
}

.info-text {
  font-size: 11px;
  color: #aaa;
  margin-top: 8px;
  text-align: center;
}
</style>
</head>

<body>
<div id="map" style="
  width: 70%;
  height: 70%;
"></div>

<div id="searchBox">
  <label>Gemeente</label>
  <select id="municipalitySelect"></select>
  <button onclick="applyMunicipality()">Toon</button>
  
  <div class="toggle-group">
    <label>
      <input type="checkbox" id="toggleTrafficSigns">
      <span> Verkeersborden (foto's)</span>
      <span class="status-text" id="signStatus">Uit</span>
    </label>
  </div>
  <div class="info-text" id="signCountInfo"></div>
  <div class="info-text" id="zoomInfo" style="color:#3b82f6;"> Zoom in tot level 14 om borden te zien</div>
</div>


<script>
const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    glyphs: "https://fonts.openmaptiles.org/{fontstack}/{range}.pbf",

    sources: {
      "pdok-grijs": {
        type: "raster",
        tiles: [
          "https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/grijs/EPSG:3857/{z}/{x}/{y}.png"
        ],
        tileSize: 256,
        attribution: "© PDOK"
      },
      "esri-satellite": {
        type: "raster",
        tiles: [
          "https://service.pdok.nl/hwh/luchtfotorgb/wmts/v1_0/Actueel_orthoHR/EPSG:3857/{z}/{x}/{y}.jpeg"
        ],
        tileSize: 256,
        attribution: "© Esri"
      },
      /* 🛣 NDW WEGEN */
      rvm_segments: {
        type: "vector",
        tiles: [
          "https://maps.ndw.nu/api/v1/nwb/latest/mbtiles/roadSections/tiles/{z}/{x}/{y}.pbf"
        ]
      },
      trafficSigns: {
        type: "geojson",
        data: { type: "FeatureCollection", features: [] }
      }
    },

    layers: [
      {
        id: "pdok-grijs-layer",
        type: "raster",
        source: "pdok-grijs",
        paint: {
          "raster-brightness-max": 0.3,
          "raster-contrast": 0.3,
          "raster-saturation": -0.8,
          "raster-opacity": 0.95
        }
      },
      {
        id: "esri-satellite-layer",
        type: "raster",
        source: "esri-satellite",
        layout: { visibility: "none" },
        paint: {
          "raster-opacity": 0.9,
          "raster-brightness-max": 0.6,
          "raster-contrast": 0.5,
          "raster-saturation": 0.0
        }
      },
      {
        id: "rvm-lines",
        type: "line",
        source: "rvm_segments",
        "source-layer": "roadSections",
        paint: {
          "line-color": "rgba(10,10,10,1)",
          "line-width": [
            "interpolate", ["linear"], ["zoom"],
            6, 0.5,
            10, 1.2,
            14, 2.5,
            18, 4
          ],
          "line-opacity": 0.85
        }
      },
      {
        id: "trafficSigns",
        type: "symbol",
        source: "trafficSigns",
        minzoom: 13.0,
        layout: {
          "icon-image": ["get", "icon"],
          "icon-size": 0.13,
          "icon-allow-overlap": true,
          "icon-ignore-placement": true,
          "visibility": "none" 
        }
      }
    ]
  },

  center: [5.1, 52.1],
  zoom: 8
});

map.addControl(new maplibregl.NavigationControl());

const select = document.getElementById("municipalitySelect");
const toggleCheckbox = document.getElementById("toggleTrafficSigns");
const signStatusSpan = document.getElementById("signStatus");
const signCountInfo = document.getElementById("signCountInfo");

let currentFeatures = [];         
let isLoadingSigns = false;
let abortCtrl = null;
const iconCache = new Set();        
let currentLoadRequestId = 0;  


function clearSignsSource() {
  const source = map.getSource("trafficSigns");
  if (source) {
    source.setData({ type: "FeatureCollection", features: [] });
  }
}

function updateTrafficSignsDisplay() {
  const isChecked = toggleCheckbox.checked;
  const layerId = "trafficSigns";
  
  if (isChecked) {
   map.setLayoutProperty(layerId, "visibility", "visible");
    
    if (currentFeatures.length > 0) {
     const source = map.getSource("trafficSigns");
      if (source) {
        source.setData({
          type: "FeatureCollection",
          features: currentFeatures
        });
      }
      signStatusSpan.textContent = "Aan";
      signStatusSpan.style.color = "#3b82f6";
      signCountInfo.textContent = `${currentFeatures.length} borden getoond (${iconCache.size} unieke picto's)`;
    } else {
    signStatusSpan.textContent = "Aan (laden...)";
      signCountInfo.textContent = isLoadingSigns ? "📡 Bezig met laden..." : " Nog geen borden geladen - even geduld";
    }
  } else {
  map.setLayoutProperty(layerId, "visibility", "none");
    signStatusSpan.textContent = "Uit";
    signStatusSpan.style.color = "#ff6b6b";
    
    if (currentFeatures.length > 0) {
      signCountInfo.textContent = `${currentFeatures.length} borden beschikbaar – vink aan om te tonen`;
    } else if (isLoadingSigns) {
      signCountInfo.textContent = "Borden worden op achtergrond geladen...";
    } else {
      signCountInfo.textContent = "Geen borden geladen (gebruik 'Toon' of herlaad)";
    }
  }
}

function onToggleChange() {
  updateTrafficSignsDisplay();
}
toggleCheckbox.addEventListener("change", onToggleChange);

async function loadTrafficSigns(countyCode) {
  if (abortCtrl) abortCtrl.abort();
  if (isLoadingSigns) {
  }
  
  const thisRequestId = ++currentLoadRequestId;
  
  isLoadingSigns = true;
  abortCtrl = new AbortController();
  
  currentFeatures = [];
  clearSignsSource();       
  
  signCountInfo.textContent = "🔄 Borden laden op achtergrond... (even geduld)";
  updateTrafficSignsDisplay(); 
  
  try {
    const response = await fetch(
      `https://data.ndw.nu/api/rest/static-road-data/traffic-signs/v4/current-state?countyCode=${countyCode}`,
      { signal: abortCtrl.signal }
    );
    
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const json = await response.json();
    
    if (thisRequestId !== currentLoadRequestId) {
      console.log("Nieuwer verzoek, oude data overslaan");
      return;
    }
    
    const features = json.features || [];
    if (features.length === 0) {
      signCountInfo.textContent = `⚠️ Geen borden gevonden voor ${countyCode}`;
      currentFeatures = [];
      updateTrafficSignsDisplay();
      isLoadingSigns = false;
      return;
    }
    
    signCountInfo.textContent = `${features.length} borden gevonden, pictogrammen laden...`;
    
    const loadImageTasks = [];
    let loadedImagesCount = 0;
    let totalUniqueImages = 0;
    
    for (const f of features) {
      const props = f.properties;
      if (!props?.imageUrl || !props?.rvvCode) continue;
      const iconId = "rvv-" + props.rvvCode;
      props.icon = iconId;
      
      if (!iconCache.has(iconId)) {
        totalUniqueImages++;
        iconCache.add(iconId);
        
        loadImageTasks.push(new Promise((resolve) => {
          map.loadImage(props.imageUrl, (err, img) => {
            if (!err && img && !map.hasImage(iconId)) {
              map.addImage(iconId, img);
              loadedImagesCount++;
              if (thisRequestId === currentLoadRequestId) {
                signCountInfo.textContent = `${features.length} borden, ${loadedImagesCount}/${totalUniqueImages} pictogrammen geladen...`;
              }
            }
            resolve();
          });
        }));
      }
    }
  
    await Promise.all(loadImageTasks);
    
    if (thisRequestId !== currentLoadRequestId) {
      console.log("Request verouderd na icon loading");
      return;
    }
    
    currentFeatures = features;
    
    updateTrafficSignsDisplay();  // Deze checkt of checkbox aan is en zet dan data in bron
    
    // Aanvullende melding
    if (toggleCheckbox.checked) {
      signCountInfo.textContent = `${features.length} borden getoond (${iconCache.size} unieke pictogrammen)`;
    } else {
      signCountInfo.textContent = `${features.length} borden geladen – vink 'Verkeersborden' aan om te tonen`;
    }
    
  } catch (err) {
    if (err.name !== 'AbortError') {
      console.error("Fout bij laden:", err);
      signCountInfo.textContent = "Fout bij laden verkeersborden";
      currentFeatures = [];
      clearSignsSource();
      updateTrafficSignsDisplay();
    }
  } finally {
    if (thisRequestId === currentLoadRequestId) {
      isLoadingSigns = false;
    }
  }
}

gemeenten.forEach(g => {
  const opt = document.createElement("option");
  opt.value = g.code;
  opt.textContent = g.naam;
  select.appendChild(opt);
});

function applyMunicipality() {
  const selectedCode = select.value;
  const g = gemeenten.find(x => x.code === selectedCode);
  if (!g) return;
  
  // Wegen filteren op gemeentenaam
  map.setFilter("rvm-lines", [
    "==",
    ["get", "municipalityName"],
    g.naam
  ]);
  
  //  Kaart inzoomen op gemeentegrens
  map.fitBounds(g.bounds, { padding: 50, duration: 500 });
  
  //  Checkbox uitzetten (gebruiker moet zelf aanvinken om borden te zien)
  if (toggleCheckbox.checked) {
    toggleCheckbox.checked = false;
    updateTrafficSignsDisplay();   // meteen zichtbaarheid uitzetten
  }
  
  //  Nieuwe borden laden in achtergrond (checkbox staat uit, maar data wordt klaargezet)
  loadTrafficSigns("GM" + g.code);
}

map.on("click", "trafficSigns", (e) => {
  const props = e.features[0].properties;
  let html = `<strong>Verkeersbord</strong><br><br>
    <b>Code:</b> ${props.rvvCode || "-"}<br>
    <b>Type:</b> ${props.rvvCodeTxt || "-"}<br>
    <b>Status:</b> ${props.status || "-"}<br>
    <b>Weg:</b> ${props.roadName || "-"}`;
  
  if (props.imageUrl) {
    html += `<br><br><img src="${props.imageUrl}" style="max-width:200px; max-height:150px; border-radius:4px;">`;
  }
  
  new maplibregl.Popup()
    .setLngLat(e.lngLat)
    .setHTML(html)
    .addTo(map);
});

map.on("mouseenter", "trafficSigns", () => {
  map.getCanvas().style.cursor = "pointer";
});
map.on("mouseleave", "trafficSigns", () => {
  map.getCanvas().style.cursor = "";
});

function updateZoomInfo() {
  const zoom = map.getZoom();
  const zoomInfoDiv = document.getElementById("zoomInfo");
  if (zoom >= 14) {
    zoomInfoDiv.innerHTML = "Zoomlevel " + Math.round(zoom * 10) / 10 + " - Borden zijn zichtbaar (indien aangevinkt)";
    zoomInfoDiv.style.color = "#4ade80";
  } else {
    zoomInfoDiv.innerHTML = "Zoom in tot level 14 om borden te zien (huidig: " + Math.round(zoom * 10) / 10 + ")";
    zoomInfoDiv.style.color = "#3b82f6";
  }
}
map.on("zoomend", updateZoomInfo);
map.on("moveend", updateZoomInfo);

map.on("load", () => {
  // Helmond code uit gemeentes.js (code = "0794")
  const helmond = gemeenten.find(g => g.code === "0794");
  if (helmond) {
    // Dropdown instellen
    select.value = "0794";
    
    // Wegfilter op Helmond
    map.setFilter("rvm-lines", [
      "==",
      ["get", "municipalityName"],
      helmond.naam
    ]);
    
    // Kaart richten op Helmond
    map.fitBounds(helmond.bounds, { padding: 50, duration: 700 });
    
    loadTrafficSigns("GM0794");
    
    // Zoominfo updaten
    updateZoomInfo();
    
    // Kleine extra: statusinfo dat borden geladen kunnen worden
    signCountInfo.textContent = "Helmond geladen → Vink 'Verkeersborden' aan om te tonen";
    signStatusSpan.textContent = "Uit";
  } else {
    // Fallback: eerste gemeente uit de lijst
    const first = gemeenten[0];
    if (first) {
      select.value = first.code;
      map.setFilter("rvm-lines", ["==", ["get", "municipalityName"], first.naam]);
      map.fitBounds(first.bounds, { padding: 50 });
      loadTrafficSigns("GM" + first.code);
    }
  }

});

</script>
</body>
</html>
